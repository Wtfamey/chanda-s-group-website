<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — wide brand mark -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Primary Meta -->
    <title>Chanda's Group – Dreams Abode | Premium Real Estate Mumbai</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chanda's Group – Dreams Abode | Premium Real Estate" />

    <!-- Cinzel (closest web-safe to Cinzel Bold — for headings/brand name) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="theme-color" content="#050e1a" />
